[package]
name = "portico-core"
description = "Portico business engine: ssh_config, sessions, PTY, SFTP, tunnels, keys, secrets, snippets. UI-agnostic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Never published to crates.io: it depends on path crates (portico-winsec).
publish = false

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
bytes.workspace = true
russh.workspace = true
russh-sftp.workspace = true
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
directories.workspace = true
time.workspace = true
keyring.workspace = true
secrecy.workspace = true
zeroize.workspace = true
argon2 = { workspace = true, features = ["zeroize"] }
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
nucleo-matcher.workspace = true
hmac.workspace = true
sha1.workspace = true
base64.workspace = true
pkcs8.workspace = true
ureq.workspace = true
rustls.workspace = true
semver.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Owner-only DACLs (the Windows `0600`/`0700`), see `winfs.rs`.
[target.'cfg(windows)'.dependencies]
portico-winsec.workspace = true

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
base64.workspace = true
hmac.workspace = true
sha1.workspace = true
tokio = { workspace = true, features = ["test-util"] }
vte.workspace = true

[lints]
workspace = true
