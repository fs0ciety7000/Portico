[package]
name = "portico-winsec"
description = "Portico's Windows file security: owner-only protected DACLs and ACL audit. The only crate of the workspace allowed to contain `unsafe` (ADR in docs/STACK.md); empty on other platforms."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# Same version as the rest of the tree (tokio, mio, rustls…): no new crate in
# Cargo.lock. Only the API families used below.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_ErrorReporting",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt", "macros"] }

# The workspace lints, except `unsafe_code`: `deny` (not `forbid`) so that
# each function wrapping a Win32 call can carry a reviewed
# `#[allow(unsafe_code)]`. Every `unsafe` block must be documented
# (`SAFETY:`) and hold a single unsafe operation.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
