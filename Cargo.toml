[workspace]
resolver = "3"
members = [
    "crates/portico-core",
    "crates/portico-theme",
    "crates/portico-winsec",
    "apps/portico-tui",
    "apps/portico-gui/src-tauri",
]
# The GUI needs system WebView dev libraries (webkit2gtk-4.1 on Linux).
# Keep it out of the default set so `cargo check` / `cargo test` work everywhere;
# build it explicitly with `cargo build -p portico-gui`.
default-members = [
    "crates/portico-core",
    "crates/portico-theme",
    "crates/portico-winsec",
    "apps/portico-tui",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fs0ciety7000/Portico"
authors = ["Portico contributors"]

[workspace.dependencies]
# Internal
portico-core = { path = "crates/portico-core" }
portico-theme = { path = "crates/portico-theme" }
# Windows file ACLs: the one crate allowed `unsafe` (ADR "Phase 8 — ACL Windows").
portico-winsec = { path = "crates/portico-winsec" }

# Async runtime & plumbing
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
bytes = "1"

# SSH / SFTP / keys
russh = "0.64"
russh-sftp = "3"
# CSPRNG for key generation (same version russh and ssh-key use).
rand = "0.10"

# known_hosts hashing (HMAC-SHA1, OpenSSH format)
hmac = "0.13"
sha1 = "0.11"
base64 = "0.22"
# Encrypted PKCS#8 parameters, read before any KDF runs (same version russh
# pins; no new crate in Cargo.lock).
pkcs8 = { version = "0.11", features = ["pkcs5"] }

# Errors, logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
color-eyre = "0.6"

# Data & storage
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "1"
# Format-preserving edits of hand-editable files (hosts.toml, settings.toml).
toml_edit = "0.25"
directories = "6"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# Secrets
keyring = "4"
# Windows only: entries with a chosen persistence (`Entry::new_with_modifiers`,
# not wrapped by `keyring`). Already in the lock as a dependency of `keyring`.
keyring-core = "1"
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.6"
chacha20poly1305 = "0.11"
# Encrypted folder sync (ADR "Synchronisation chiffrée par dossier"): HKDF
# subkeys, SHA-256 fingerprints and constant-time MAC compare. All three were
# already in the lock (through russh / argon2); now direct dependencies.
hkdf = "0.13"
sha2 = "0.11"
subtle = "2.6"
# Passphrase strength estimate of the sync passphrase (same ADR). Without the
# `builder` feature: no proc-macro dependency.
zxcvbn = { version = "3.1", default-features = false }

# Process hardening (safe wrappers: setrlimit, prctl).
rustix = { version = "1.1", features = ["fs", "process"] }

# Opt-in update check (ADR "Vérification des mises à jour"): a blocking
# HTTPS client, rustls on the aws-lc-rs provider russh already uses, system
# roots through the platform verifier; no gzip, no cookies, no JSON layer.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
# Version comparison of releases (already in the lock as a build dependency).
semver = "1"

# Search
nucleo-matcher = "0.3"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
alacritty_terminal = "0.26"

# GUI
tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.6", features = [] }
tauri-plugin-dialog = "=2.8.1"
# Re-validation of terminal links before opening (already in the lock through
# Tauri; ADR "Liens du terminal").
url = "2.5"

# Dev
tempfile = "3"
# Property tests of the sync merge laws (ADR "Synchronisation chiffrée par dossier").
proptest = { version = "1", default-features = false, features = ["std"] }
pretty_assertions = "1"
# VT parser of alacritty_terminal (same version: no new crate in the lock),
# for differential tests of the playback sanitiser.
vte = { version = "0.15.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Clippy 1.99: russh handler traits are implemented with `async fn` so every
# callback reads alike, awaiting or not; the `fn -> impl Future` rewrite is noise.
unused_async_trait_impl = "allow"
# Clippy 1.99: `assert!(x.is_empty())` reads better in tests than the suggested
# `assert_eq!(x, [] as [T; 0])`, which also needs `PartialEq` on every element type.
assert_is_empty = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
