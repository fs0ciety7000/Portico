[workspace]
resolver = "3"
members = [
    "crates/portico-core",
    "crates/portico-theme",
    "apps/portico-tui",
    "apps/portico-gui/src-tauri",
]
# The GUI needs system WebView dev libraries (webkit2gtk-4.1 on Linux).
# Keep it out of the default set so `cargo check` / `cargo test` work everywhere;
# build it explicitly with `cargo build -p portico-gui`.
default-members = [
    "crates/portico-core",
    "crates/portico-theme",
    "apps/portico-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fs0ciety7000/Portico"
authors = ["Portico contributors"]

[workspace.dependencies]
# Internal
portico-core = { path = "crates/portico-core" }
portico-theme = { path = "crates/portico-theme" }

# Async runtime & plumbing
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
bytes = "1"

# SSH / SFTP / keys
russh = "0.64"
russh-sftp = "3"

# known_hosts hashing (HMAC-SHA1, OpenSSH format)
hmac = "0.13"
sha1 = "0.11"
base64 = "0.22"

# Errors, logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
color-eyre = "0.6"

# Data & storage
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# Secrets
keyring = "4"
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.6"
chacha20poly1305 = "0.11"

# Search
nucleo-matcher = "0.3"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
alacritty_terminal = "0.26"

# GUI
tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.6", features = [] }

# Dev
tempfile = "3"
pretty_assertions = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
