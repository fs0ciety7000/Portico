[package]
name = "portico-tui"
description = "Portico terminal user interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Applications, never published to crates.io (path dependencies on the core).
publish = false

[[bin]]
name = "portico"
path = "src/main.rs"

[dependencies]
portico-core.workspace = true
portico-theme.workspace = true
tokio.workspace = true
futures.workspace = true
ratatui.workspace = true
crossterm.workspace = true
alacritty_terminal.workspace = true
color-eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytes.workspace = true
secrecy.workspace = true
zeroize.workspace = true
# `event`: poll on stdin with a timeout for the OSC 11 background query of
# the `auto` theme (`appearance.rs`), without `unsafe`.
rustix = { workspace = true, features = ["event"] }
# `local-offset`: dates in local time, the offset read once at startup
# (before the runtime's threads, see `ui::fmt::init_local_offset`).
time = { workspace = true, features = ["local-offset"] }

[dev-dependencies]
tempfile.workspace = true
# The in-process SSH server of portico-core's tests (`ssh_support` in
# main.rs): pane tests run real sessions without any network.
russh.workspace = true
russh-sftp.workspace = true
serde_json.workspace = true

[lints]
workspace = true
